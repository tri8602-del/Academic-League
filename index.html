<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Academic League Coach</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="League Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f2f4f8;color:#1b2533;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:#1f3a5f;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h2{font-size:18px;margin:0 0 10px}
button{font:inherit;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;background:#e4e9f1;color:#1b2533;min-height:52px;cursor:pointer}
button:active{filter:brightness(.9)}
.pri{background:#1f6feb;color:#fff}.ok{background:#1a9b4b;color:#fff}.bad{background:#d23b3b;color:#fff}.opp{background:#7a4cc2;color:#fff}.mut{background:#8a94a6;color:#fff}
.full{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
input{font:inherit;font-size:17px;padding:12px;border:1px solid #c8d0dc;border-radius:10px;width:100%}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eef}
.li span{flex:1;font-size:17px}.li button{min-height:44px;padding:8px 12px;font-size:15px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{background:#eef2f8;border:2px solid transparent}.chip.on{background:#d7e7ff;border-color:#1f6feb}
.chip.lock{opacity:.4}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #dde;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border-radius:0;font-size:13px;min-height:62px}
nav button.on{color:#1f6feb}
.score{display:flex;justify-content:space-around;text-align:center;background:#1f3a5f;color:#fff;border-radius:14px;padding:10px}
.score b{display:block;font-size:40px}.qbar{text-align:center;font-weight:700;font-size:18px;margin:10px 0}
.small{font-size:13px;color:#5b6678}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:7px 4px;text-align:center;border-bottom:1px solid #eef}th:first-child,td:first-child{text-align:left}
.tag{font-size:12px;padding:2px 7px;border-radius:999px;font-weight:700}.tin{background:#d8f3e2;color:#14743a}.tout{background:#fde2e2;color:#a12a2a}
.log{font-size:13px;color:#5b6678;max-height:150px;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<header><h1 id="title">Academic League Coach</h1></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY="tcalCoachV1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{roster:[],matches:[],cur:null};
let tab="roster",sel=null,draft=null,subPick=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=id=>(S.roster.find(p=>p.id===id)||{name:"(removed)"}).name;
const M=()=>S.matches.find(m=>m.id===S.cur);
const $=s=>document.querySelector(s);
// ---- scoring ----
function totals(m){let us=0,them=0;m.events.forEach(e=>{us+=e.us;them+=e.them});return{us,them}}
function pstats(events){const o={};const g=id=>o[id]??={c:0,w:0,pts:0};
  events.forEach(e=>{if(!e.pid||e.q>15)return;const s=g(e.pid);if(e.res==="c"){s.c++;s.pts+=e.us}else if(e.res==="w")s.w++;});return o}
const buzzRate=s=>s&&s.c+s.w?s.w/(s.c+s.w):0;
// Lightning: per finished round, correct out of 5 and the 4 players who were in.
function lightningRounds(ms){const out=[];ms.forEach(m=>[1,2].forEach(r=>{const ev=m.events.filter(e=>e.round===r&&e.q>15);if(ev.length<5||!m.lineups[r-1]?.length)return;out.push({m,round:r,correct:ev.filter(e=>e.code==="lC").length,players:m.lineups[r-1]})}));return out}
function lightningByPlayer(rounds){const o={};rounds.forEach(x=>x.players.forEach(id=>{o[id]??={n:0,sum:0};o[id].n++;o[id].sum+=x.correct}));return o}
const acc=s=>s&&s.c+s.w?Math.round(s.c/(s.c+s.w)*100):null;
function seasonStats(excludeId){return pstats(S.matches.filter(m=>m.id!==excludeId).flatMap(m=>m.events))}
// outcomes: res c/w applies to pid
const TOSS=[
 ["usC","✓ Our player correct  +2","ok",{us:2,res:"c",need:1}],
 ["usW","✗ Our player wrong (no steal)","bad",{res:"w"}],
 ["usWoppS","✗ Ours wrong → Opp steal ✓  +1 opp","bad",{them:1,res:"w"}],
 ["oppC","Opponent correct  +2 opp","opp",{them:2}],
 ["oppWusS","Opp wrong → Our steal ✓  +1 us","ok",{us:1,res:"c"}],
 ["oppWusW","Opp wrong → Our steal ✗","bad",{res:"w"}],
 ["oppW","Opp wrong, no steal","opp",{}],
 ["none","No answer","mut",{}]];
// Lightning is team-only: no player credit, counted per round as x/5 with that round's 4 players.
const LIGHT=[["lC","✓ Correct  +2","ok",{us:2}],["lW","✗ Wrong / no answer","bad",{}]];
function record(code){const m=M();const lightning=m.q>15;const o=(lightning?LIGHT:TOSS).find(x=>x[0]===code)[3];
  if(o.need&&!sel){alert("Tap the player who answered first.");return}
  m.events.push({round:m.round,q:m.q,code,pid:o.res&&!lightning?sel:null,res:o.res||null,us:o.us||0,them:o.them||0});
  sel=null;m.q++;if(m.q>20){if(m.round===1){m.stage="sub"}else{m.stage="done";m.done=true}}save();render()}
function undo(){const m=M();const e=m.events.pop();if(!e)return;m.round=e.round;m.q=e.q;m.stage="live";m.done=false;sel=null;save();render()}
// ---- views ----
function vRoster(){return `<div class="card"><h2>Roster (${S.roster.length})</h2>
 ${S.roster.map(p=>`<div class="li"><span>${esc(p.name)}</span><button onclick="ren('${p.id}')">Edit</button><button class="bad" onclick="del('${p.id}')">Remove</button></div>`).join("")||'<p class="small">No students yet.</p>'}
 <div class="row" style="margin-top:12px"><input id="newName" placeholder="Student name" onkeydown="if(event.key==='Enter')add()"><button class="pri" style="flex:0 0 90px" onclick="add()">Add</button></div></div>
 <div class="card"><h2>Backup</h2><div class="row"><button onclick="exp()">Export JSON</button><button onclick="$('#imp').click()">Import JSON</button></div><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="imp(this)"></div>`}
function add(){const v=$("#newName").value.trim();if(!v)return;S.roster.push({id:uid(),name:v});save();render();setTimeout(()=>$("#newName").focus(),0)}
function ren(id){const p=S.roster.find(x=>x.id===id);const v=prompt("Name",p.name);if(v&&v.trim()){p.name=v.trim();save();render()}}
function del(id){if(confirm(`Remove ${nm(id)} from the roster? (Past stats are kept.)`)){S.roster=S.roster.filter(p=>p.id!==id);save();render()}}
function vMatch(){const m=M();
 if(m&&!m.done){if(m.stage==="sub")return vSub(m);return vLive(m)}
 draft??={opp:"",date:new Date().toLocaleDateString("en-CA"),travel:[],start:[]};
 const step=draft.travel.length===8;
 return `<div class="card"><h2>New match</h2><input id="opp" placeholder="Opponent" value="${esc(draft.opp)}" oninput="draft.opp=this.value"><div style="height:8px"></div><input id="dt" type="date" value="${draft.date}" oninput="draft.date=this.value"></div>
 <div class="card"><h2>Travel 8 <span class="small">(${draft.travel.length}/8 in the room)</span></h2><div class="chips">${S.roster.map(p=>{const on=draft.travel.includes(p.id);return `<button class="chip ${on?"on":""} ${!on&&step?"lock":""}" onclick="tg('travel','${p.id}',8)">${esc(p.name)}</button>`}).join("")||'<p class="small">Add students on the Roster tab first.</p>'}</div></div>
 ${step?`<div class="card"><h2>Starting 4 <span class="small">(${draft.start.length}/4)</span></h2><div class="chips">${draft.travel.map(id=>{const on=draft.start.includes(id);return `<button class="chip ${on?"on":""} ${!on&&draft.start.length===4?"lock":""}" onclick="tg('start','${id}',4)">${esc(nm(id))}</button>`}).join("")}</div></div>`:""}
 <button class="pri full" onclick="startMatch()">Start match</button>`}
function tg(k,id,max){const a=draft[k];const i=a.indexOf(id);if(i>=0){a.splice(i,1);if(k==="travel")draft.start=draft.start.filter(x=>x!==id)}else if(a.length<max)a.push(id);render()}
function startMatch(){if(!draft.opp.trim())return alert("Enter the opponent.");if(draft.travel.length!==8&&!confirm(`Only ${draft.travel.length} in the room selected. Continue?`))return;if(draft.start.length!==4)return alert("Pick the starting 4.");
 const m={id:uid(),opp:draft.opp.trim(),date:draft.date,travel:[...draft.travel],lineups:[[...draft.start],[]],round:1,q:1,stage:"live",events:[],done:false};S.matches.push(m);S.cur=m.id;draft=null;save();render()}
function vLive(m){const t=totals(m);const lightning=m.q>15;const lu=m.lineups[m.round-1];
 return `<div class="score"><div>Us<b>${t.us}</b></div><div>${esc(m.opp)}<b>${t.them}</b></div></div>
 <div class="qbar">Round ${m.round} of 2 · Q${m.q} of 20 · ${lightning?"⚡ Lightning (2 pts)":"Toss-up (2 pts / steal 1)"}</div>
 ${lightning?`<div class="card"><div class="small">Lightning is team-only. In: ${lu.map(id=>esc(nm(id))).join(", ")} · Correct so far: <b>${m.events.filter(e=>e.round===m.round&&e.q>15&&e.code==="lC").length}/${m.q-16}</b></div></div>`:`<div class="card"><div class="small" style="margin-bottom:6px">Who buzzed? (tap first for our answers; optional on steals)</div><div class="chips">${lu.map(id=>`<button class="chip ${sel===id?"on":""}" onclick="sel=sel==='${id}'?null:'${id}';render()">${esc(nm(id))}</button>`).join("")}</div></div>`}
 <div class="grid2">${(lightning?LIGHT:TOSS).map(x=>`<button class="${x[2]}" style="min-height:70px" onclick="record('${x[0]}')">${x[1]}</button>`).join("")}</div>
 <div class="row" style="margin-top:12px"><button onclick="undo()">↶ Undo last</button><button class="mut" onclick="if(confirm('End this match now?')){M().done=true;M().stage='done';save();tab='stats';render()}">End match</button></div>
 <div class="card" style="margin-top:12px"><div class="log">${m.events.slice().reverse().map(e=>`R${e.round} Q${e.q}: ${e.code}${e.pid?" – "+esc(nm(e.pid)):""} (+${e.us}/+${e.them})`).join("<br>")||"No questions yet."}</div></div>`}
function suggestion(m){const ms=pstats(m.events.filter(e=>e.round===1)),ss=seasonStats(m.id);
 // a player who has not answered yet this match counts as season accuracy (or 50%), not 0%
 // Each wrong buzz costs 1 point in the ranking (penalizes a high wrong-buzz rate); ties by accuracy, then season.
 const sc=id=>[(ms[id]?.pts||0)-(ms[id]?.w||0),acc(ms[id])??acc(ss[id])??50,(ss[id]?.pts||0)-(ss[id]?.w||0),acc(ss[id])??-1];
 return [...m.travel].sort((a,b)=>{const x=sc(a),y=sc(b);for(let i=0;i<4;i++)if(x[i]!==y[i])return y[i]-x[i];return 0}).slice(0,4)}
function vSub(m){const ms=pstats(m.events.filter(e=>e.round===1)),ss=seasonStats(m.id),sug=suggestion(m);subPick??=[...m.lineups[0]];const t=totals(m);
 return `<div class="score"><div>Us<b>${t.us}</b></div><div>${esc(m.opp)}<b>${t.them}</b></div></div>
 <div class="card" style="margin-top:12px"><h2>Between rounds – subs</h2><p class="small">Suggested 4 ranked by Round 1 points minus wrong buzzes, then accuracy, then season. Lightning R1: <b>${lightningRounds([m]).find(x=>x.round===1)?.correct??"–"}/5</b> (team). Tap rows to choose Round 2 players.</p>
 <table><tr><th>Player</th><th>✓</th><th>Wrong buzzes</th><th>Pts</th><th>Acc</th><th>Season</th><th></th></tr>
 ${m.travel.map(id=>{const s=ms[id]||{c:0,w:0,pts:0},se=ss[id];const on=subPick.includes(id),was=m.lineups[0].includes(id);return `<tr onclick="tgSub('${id}')" style="background:${on?"#e3eeff":""}"><td><b>${on?"☑":"☐"} ${esc(nm(id))}</b>${was?' <span class="small">(R1)</span>':""}</td><td>${s.c}</td><td>${s.w}${s.c+s.w?` <span class="small">(${Math.round(buzzRate(s)*100)}%)</span>`:""}</td><td>${s.pts}</td><td>${acc(s)??"–"}${acc(s)!=null?"%":""}</td><td class="small">${se?se.pts+"p "+(acc(se)??"–")+"% "+se.w+"✗":"–"}</td><td>${sug.includes(id)?'<span class="tag tin">IN</span>':'<span class="tag tout">OUT</span>'}</td></tr>`}).join("")}</table>
 <div class="row" style="margin-top:12px"><button onclick="subPick=[...suggestion(M())];render()">Use suggestion</button><button onclick="subPick=[...M().lineups[0]];render()">Keep same 4</button></div></div>
 <button class="pri full" onclick="startR2()">Start Round 2 (${subPick.length}/4)</button><div style="height:8px"></div><button class="full" onclick="undo()">↶ Undo last question</button>`}
function tgSub(id){const i=subPick.indexOf(id);if(i>=0)subPick.splice(i,1);else if(subPick.length<4)subPick.push(id);render()}
function startR2(){if(subPick.length!==4)return alert("Pick 4 players.");const m=M();m.lineups[1]=[...subPick];m.round=2;m.q=1;m.stage="live";subPick=null;save();render()}
function statTable(st){const ids=Object.keys(st).sort((a,b)=>st[b].pts-st[a].pts);return ids.length?`<table><tr><th>Player</th><th>✓</th><th>Wrong buzzes</th><th>Pts</th><th>Acc</th></tr>${ids.map(id=>`<tr><td>${esc(nm(id))}</td><td>${st[id].c}</td><td>${st[id].w}</td><td>${st[id].pts}</td><td>${acc(st[id])??"–"}%</td></tr>`).join("")}</table>`:'<p class="small">No player answers yet.</p>'}
function lightningTable(){const lr=lightningRounds(S.matches),by=lightningByPlayer(lr),all=lr.length?lr.reduce((a,x)=>a+x.correct,0)/lr.length:null;const ids=Object.keys(by).sort((a,b)=>by[b].sum/by[b].n-by[a].sum/by[a].n);
 return `<div class="card"><h2>Lightning lineups</h2><p class="small">Average lightning correct (out of 5) in rounds each player was in. Team average: ${all==null?"–":all.toFixed(1)} over ${lr.length} round${lr.length===1?"":"s"}.</p>${ids.length?`<table><tr><th>Player</th><th>Rounds in</th><th>Avg /5</th></tr>${ids.map(id=>`<tr><td>${esc(nm(id))}</td><td>${by[id].n}</td><td><b>${(by[id].sum/by[id].n).toFixed(1)}</b></td></tr>`).join("")}</table>`:'<p class="small">No complete lightning rounds yet.</p>'}</div>`}
function vStats(){return `<div class="card"><h2>Season totals (toss-ups &amp; steals)</h2>${statTable(pstats(S.matches.flatMap(m=>m.events)))}</div>`+lightningTable()+
 S.matches.slice().reverse().map(m=>{const t=totals(m);return `<div class="card"><h2>vs ${esc(m.opp)} <span class="small">${esc(m.date)} · ${m.done?"final":"in progress"}</span></h2><div class="qbar">${t.us} – ${t.them}</div><p class="small">${lightningRounds([m]).map(x=>`Lightning R${x.round}: <b>${x.correct}/5</b> (${x.players.map(id=>esc(nm(id))).join(", ")})`).join("<br>")||"No complete lightning rounds."}</p>${statTable(pstats(m.events))}<button class="bad" style="min-height:40px;margin-top:8px;font-size:14px" onclick="delMatch('${m.id}')">Delete match</button></div>`}).join("")}
function delMatch(id){if(confirm("Delete this match and its stats?")){S.matches=S.matches.filter(m=>m.id!==id);if(S.cur===id)S.cur=null;save();render()}}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download=`league-coach-backup-${new Date().toLocaleDateString("en-CA")}.json`;a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.roster)||!Array.isArray(d.matches))throw 0;if(confirm(`Replace everything with this backup (${d.roster.length} students, ${d.matches.length} matches)?`)){S=d;save();render()}}catch{alert("That file isn't a League Coach backup.")}inp.value=""})}
function render(){const m=M();$("#app").innerHTML=tab==="roster"?vRoster():tab==="match"?vMatch():vStats();
 $("#nav").innerHTML=[["roster","👥 Roster"],["match",m&&!m.done?"🔴 Live match":"🏁 Match"],["stats","📊 Stats"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("")}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
