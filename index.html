<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Academic League Coach</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="League Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f2f4f8;color:#1b2533;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:#1f3a5f;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h2{font-size:18px;margin:0 0 10px}
button{font:inherit;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;background:#e4e9f1;color:#1b2533;min-height:52px;cursor:pointer}
button:active{filter:brightness(.9)}
.pri{background:#1f6feb;color:#fff}.ok{background:#1a9b4b;color:#fff}.bad{background:#d23b3b;color:#fff}.opp{background:#7a4cc2;color:#fff}.mut{background:#8a94a6;color:#fff}
.full{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
input{font:inherit;font-size:17px;padding:12px;border:1px solid #c8d0dc;border-radius:10px;width:100%}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eef}
.li span{flex:1;font-size:17px}.li button{min-height:44px;padding:8px 9px;font-size:14px;white-space:nowrap}.li .gradeSel{font-size:14px;padding:6px 4px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{background:#eef2f8;border:2px solid transparent}.chip.on{background:#d7e7ff;border-color:#1f6feb}
.chip.lock{opacity:.4}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #dde;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border-radius:0;font-size:13px;min-height:62px}
nav button.on{color:#1f6feb}
.score{display:flex;justify-content:space-around;text-align:center;background:#1f3a5f;color:#fff;border-radius:14px;padding:10px}
.score b{display:block;font-size:40px}.qbar{text-align:center;font-weight:700;font-size:18px;margin:10px 0}
.teamSw{display:flex;background:#ffffff22;border-radius:10px;padding:3px}.teamSw button{min-height:40px;padding:6px 14px;font-size:15px;background:none;color:#fff}.teamSw button.on{background:#fff;color:#1f3a5f}
.cats{display:flex;flex-wrap:wrap;gap:6px}.cats button{flex:1 0 28%;min-height:46px;padding:8px 6px;font-size:15px;background:#fff3d6;border:2px solid transparent}.cats button.on{background:#ffd24a;border-color:#b98800}
.gradeSel{width:auto;min-height:44px;padding:6px;font:inherit;font-size:15px;border:1px solid #c8d0dc;border-radius:10px;background:#fff}
.att{display:flex;gap:4px}.att button{min-height:40px;padding:6px 10px;font-size:14px}
.lrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #eef}.lrow span{flex:1}.lrow button{min-height:48px;padding:6px 10px;font-size:15px}
.step{display:flex;align-items:center;gap:6px}.step input{width:64px;text-align:center;padding:8px}.step button{min-height:40px;min-width:40px;padding:4px}
.small{font-size:13px;color:#5b6678}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:7px 4px;text-align:center;border-bottom:1px solid #eef}th:first-child,td:first-child{text-align:left}
.tag{font-size:12px;padding:2px 7px;border-radius:999px;font-weight:700}.tin{background:#d8f3e2;color:#14743a}.tout{background:#fde2e2;color:#a12a2a}
.log{font-size:13px;color:#5b6678;max-height:150px;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teamCard{border:2px solid transparent;cursor:pointer}.teamCard.active{border-color:#1f6feb}
.rankRow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:15px}.rk{width:18px;color:#5b6678;font-weight:700}.rn{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{flex:1;height:10px;background:#eef2f8;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#1f6feb;border-radius:6px}.rv{width:32px;text-align:right;font-weight:700}
details .li{flex-wrap:wrap;gap:6px}details .li>span:first-child{flex:1 0 100%}.step input{width:56px}
.slot{border-top:1px solid #eef;padding:8px 0}.slotHead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.slotHead .small{flex:1}.slotHead button{min-height:40px;padding:6px 10px;font-size:14px}.slotHead button:disabled{opacity:.35}.slotRow{margin-top:6px;align-items:center}.slotRow select,.slotRow input{min-height:42px;font-size:14px;padding:6px}
.todayCard{border:2px solid #ffd24a}.tslot{border-top:1px solid #eef;padding:8px 6px;border-radius:8px}.tslot.now{background:#e7f8ee}.tslot.next{background:#eef4ff}.tsHead{display:flex;gap:8px;align-items:center}.tsRow{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:14px}.tsRow span{flex:1}.tsRow button{min-height:42px;padding:6px 10px;font-size:14px}
.warn{background:#fff3d6;border-radius:10px;padding:8px 10px;font-size:14px;margin:6px 0}
.report{background:#fff;border-radius:14px;padding:16px;font-size:14px}.rhead{border-bottom:2px solid #1f3a5f;margin-bottom:10px}.rhead h1{font-size:20px;margin:0}.rhead div{color:#5b6678;font-size:12px}.report h2{font-size:16px;margin:14px 0 6px}.rt{font-size:13px}.rt td{white-space:nowrap}.rt th{background:#eef2f8}
nav button{font-size:12px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;padding:0}main{padding:0;max-width:none}.report{border-radius:0;padding:0}.rt tr{break-inside:avoid}}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:8px"><h1 id="title" style="flex:1">League Coach</h1><div id="teamSw" class="teamSw"></div></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY="tcalCoachV1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{roster:[],matches:[],cur:null};
// Teams: Varsity (V) and JV. Older data (before teams) becomes Varsity.
S.team??="V";S.curBy??={V:S.cur||null,JV:null};delete S.cur;S.roster.forEach(p=>p.team??="V");S.matches.forEach(m=>m.team??="V");
const TEAMS={V:"Varsity",JV:"JV"};
const teamRoster=()=>S.roster.filter(p=>p.team===S.team);
const teamMatches=()=>S.matches.filter(m=>(m.team||"V")===S.team);
function setTeam(t){S.team=t;draft=null;subPick=null;sel=null;cat=null;tf={step:0};save();render()}
const CATS=["Math","ELA/Literature","History/Current Events","Mythology","Science","Sports","Geography","Other"];
// Older categories are counted under the combined names (saved events are not rewritten).
const normCat=c=>c==="ELA"||c==="Literature"?"ELA/Literature":c==="History"?"History/Current Events":c;
let cat=null;
S.practices??=[];S.schedule??=[]; // practices / event-day schedule (added later; older data simply has none)
let tab="home",prf=null,rep=null,sel=null,draft=null,subPick=null,tf={step:0},adjOpen=false,pf=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nm=id=>(S.roster.find(p=>p.id===id)||{name:"(removed)"}).name;
const M=()=>S.matches.find(m=>m.id===S.curBy[S.team]);
const $=s=>document.querySelector(s);
// ---- scoring ----
// Lightning counts 2 per correct, also for questions saved at 1 point in v2 (saved data is not rewritten).
const evUs=e=>e.q>15&&e.code!=="adj"?(e.code==="lC"?2:0):e.us;
// A match entered after the fact shows the final scores she typed in.
function totals(m){if(m.past&&m.pastForm)return{us:parseInt(m.pastForm.us,10)||0,them:parseInt(m.pastForm.them,10)||0};let us=0,them=0;m.events.forEach(e=>{us+=evUs(e);them+=e.them});return{us,them}}
function pstats(events){const o={};const g=id=>o[id]??={c:0,w:0,pts:0};
  events.forEach(e=>{if(!e.pid||e.q>15)return;const s=g(e.pid);if(e.res==="c"){s.c++;s.pts+=e.us}else if(e.res==="w")s.w++;});return o}
const buzzRate=s=>s&&s.c+s.w?s.w/(s.c+s.w):0;
// Lightning: per finished round, correct out of 5 and the 4 players who were in.
// Categories (toss-ups only). Team: our correct/wrong regardless of player; players: their own buzzes.
const US_C=["usC","oppWusS"],US_W=["usW","usWoppS","oppWusW"];
function catStats(events){const team={},pl={};events.forEach(e=>{if(!e.cat||e.q>15)return;e={...e,cat:normCat(e.cat)};const r=US_C.includes(e.code)?"c":US_W.includes(e.code)?"w":null;if(!r)return;const t=team[e.cat]??={c:0,w:0};t[r]++;if(e.pid){const x=(pl[e.pid]??={})[e.cat]??={c:0,w:0};x[r]++}});return{team,pl}}
function bestCats(pc){if(!pc)return[];return Object.entries(pc).filter(([,v])=>v.c>0).sort((a,b)=>(b[1].c-b[1].w)-(a[1].c-a[1].w)||b[1].c-a[1].c).slice(0,2).map(([k,v])=>`${k} ${v.c}/${v.c+v.w}`)}
function catTable(events){const {team,pl}=catStats(events);const cs=CATS.filter(c=>team[c]);if(!cs.length)return '<p class="small">No categories tagged yet.</p>';
 const ids=Object.keys(pl);return `<table><tr><th>Category</th><th>✓</th><th>✗</th><th>Acc</th></tr>${cs.map(c=>`<tr><td>${c}</td><td>${team[c].c}</td><td>${team[c].w}</td><td>${acc(team[c])}%</td></tr>`).join("")}</table>
 ${ids.length?`<table style="margin-top:8px"><tr><th>Player</th><th>By category (✓/tries)</th></tr>${ids.map(id=>`<tr><td>${esc(nm(id))}</td><td class="small" style="text-align:left">${CATS.filter(c=>pl[id][c]).map(c=>`${c} ${pl[id][c].c}/${pl[id][c].c+pl[id][c].w}`).join(" · ")}</td></tr>`).join("")}</table>`:""}`}
function lightningRounds(ms){const out=[];ms.forEach(m=>[1,2].forEach(r=>{const ev=m.events.filter(e=>e.round===r&&e.q>15);if(ev.length<5||!(m.lightLineups?.[r-1]||m.lineups[r-1])?.length)return;out.push({m,round:r,correct:ev.filter(e=>e.code==="lC").length,players:m.lightLineups?.[r-1]||m.lineups[r-1]})}));return out}
function lightningByPlayer(rounds){const o={};rounds.forEach(x=>x.players.forEach(id=>{o[id]??={n:0,sum:0};o[id].n++;o[id].sum+=x.correct}));return o}
const acc=s=>s&&s.c+s.w?Math.round(s.c/(s.c+s.w)*100):null;
function seasonStats(excludeId){return pstats(teamMatches().filter(m=>m.id!==excludeId).flatMap(m=>m.events))}
const CODE_LABEL={usC:"Our correct",usW:"Our wrong",usWoppS:"Our wrong, opp steal",oppC:"Opp correct",oppWusS:"Our steal ✓",oppWusW:"Our steal ✗",oppW:"Opp wrong",none:"No buzz",lC:"⚡ correct",lW:"⚡ incorrect"};
// outcomes: res c/w applies to pid
const TOSS=[
 ["usC","✓ Our player correct  +2","ok",{us:2,res:"c",need:1}],
 ["usW","✗ Our player wrong (no steal)","bad",{res:"w"}],
 ["usWoppS","✗ Ours wrong → Opp steal ✓  +1 opp","bad",{them:1,res:"w"}],
 ["oppC","Opponent correct  +2 opp","opp",{them:2}],
 ["oppWusS","Opp wrong → Our steal ✓  +1 us","ok",{us:1,res:"c"}],
 ["oppWusW","Opp wrong → Our steal ✗","bad",{res:"w"}],
 ["oppW","Opp wrong, no steal","opp",{}],
 ["none","No answer","mut",{}]];
// Lightning is team-only: no player credit, counted per round as x/5 with that round's 4 players.
const LIGHT=[["lC","✓ Correct  +2","ok",{us:2}],["lW","✗ Wrong / no answer","bad",{}]];
function record(code){const m=M();const lightning=m.q>15;const o=(lightning?LIGHT:TOSS).find(x=>x[0]===code)[3];
  if(o.need&&!sel){alert("Tap the player who answered first.");return}
  m.events.push({round:m.round,q:m.q,code,cat:lightning?null:cat,pid:o.res&&!lightning?sel:null,res:o.res||null,us:o.us||0,them:o.them||0});
  sel=null;cat=null;tf={step:0};m.q++;if(m.q>20){if(m.round===1){m.stage="sub"}else{m.stage="done";m.done=true}}save();render()}
function undo(){const m=M();const e=m.events.pop();if(!e)return;tf={step:0};if(e.code==="adj"){save();render();return}m.round=e.round;m.q=e.q>15?16:e.q;m.stage="live";if(e.q<=15&&m.lightLineups)m.lightLineups[e.round-1]=null;m.done=false;sel=null;save();render()}
// ---- views ----
function vRoster(){return `<div class="card"><h2>${TEAMS[S.team]} roster (${teamRoster().length})</h2>
 ${teamRoster().map(p=>`<div class="li"><span>${esc(p.name)}</span><select class="gradeSel" aria-label="Grade" onchange="setGrade('${p.id}',this.value)">${gradeOpts(p.grade)}</select><button onclick="moveTeam('${p.id}')">→ ${S.team==="V"?"JV":"Varsity"}</button><button onclick="ren('${p.id}')">Edit</button><button class="bad" onclick="del('${p.id}')">Remove</button></div>`).join("")||`<p class="small">No students yet.</p><button class="pri full" onclick="loadTcal()">Load 2026-27 TCAL ${TEAMS[S.team]} roster</button>`}
 <div class="row" style="margin-top:12px"><input id="newName" placeholder="Student name" onkeydown="if(event.key==='Enter')add()"><select id="newGrade" class="gradeSel" aria-label="Grade" style="flex:0 0 84px">${gradeOpts("")}</select><button class="pri" style="flex:0 0 90px" onclick="add()">Add</button></div></div>
 <div class="card"><h2>Settings &amp; backup</h2>${backupCard()}</div>`}
function add(){const v=$("#newName").value.trim();if(!v)return;const g=+$("#newGrade").value;S.roster.push({id:uid(),name:v,team:S.team,...(g?{grade:g}:{})});save();render();setTimeout(()=>$("#newName").focus(),0)}
const TCAL={JV:[["Dan Cox",9],["Brody Dean",9],["Molly Gullett",9],["Bailey Litten",9],["John Pecjak",9],["Sam Chulick",10],["Gracie Harn",10],["Lydia Hrin",10],["Kolton Litten",10],["Kira McCollum",10],["James Shaffer",10],["Adam Wamsley",10]],
 V:[["Emilee Bazzoli",12],["Lucca Jellots",12],["Logan Yeck",12],["Molly Belk",11],["Kerrington Brown",11],["Nick Efaw",11],["Emily Hoyle",11],["Dakotah Karkowski",11],["Ashdyn Kern",11],["Kelsey Vessels",11],["Kara Wamsley",11]]};
// One tap, only offered while this team's roster is empty. A name already in the app (any team) is reused: moved to this team, grade set. No duplicates.
function loadTcal(){const key=n=>n.trim().toLowerCase().replace(/\s+/g," ");let added=0,moved=0;
 TCAL[S.team].forEach(([n,g])=>{const ex=S.roster.find(p=>key(p.name)===key(n));if(ex){ex.team=S.team;ex.grade=g;moved++}else{S.roster.push({id:uid(),name:n,team:S.team,grade:g});added++}});save();render();setTimeout(()=>alert(`Loaded ${TEAMS[S.team]} roster: ${added} added${moved?`, ${moved} already in the app (team/grade updated)`:""}.`),50)}
function moveTeam(id){const p=S.roster.find(x=>x.id===id);p.team=p.team==="V"?"JV":"V";save();render()}
// Grade level 9-12 (optional). Students without one just sort last on ties.
const gradeOpts=g=>`<option value="">Gr –</option>`+[9,10,11,12].map(n=>`<option value="${n}" ${+g===n?"selected":""}>Gr ${n}</option>`).join("");
function setGrade(id,v){const p=S.roster.find(x=>x.id===id);if(v)p.grade=+v;else delete p.grade;save();render()}
const gradeOf=id=>+(S.roster.find(p=>p.id===id)?.grade)||0;
function ren(id){const p=S.roster.find(x=>x.id===id);const v=prompt("Name",p.name);if(v&&v.trim()){p.name=v.trim();save();render()}}
function del(id){if(confirm(`Remove ${nm(id)} from the roster? (Past stats are kept.)`)){S.roster=S.roster.filter(p=>p.id!==id);save();render()}}
function vMatch(){const m=M();
 if(m&&!m.done){if(m.stage==="sub")return vSub(m);return vLive(m)}
 if(pf)return vPast();
 draft??={opp:"",date:new Date().toLocaleDateString("en-CA"),travel:[],start:[],att:{}};draft.att??={};
 const step=draft.travel.length===8;
 return `<button class="full" style="margin-bottom:12px;background:#fff3d6" onclick="openPast()">＋ Add a past match (enter results after the fact)</button><div class="card"><h2>New match</h2><input id="opp" placeholder="Opponent" value="${esc(draft.opp)}" oninput="draft.opp=this.value"><div style="height:8px"></div><input id="dt" type="date" value="${draft.date}" oninput="draft.date=this.value"></div>
 <div class="card"><h2>Attendance <span class="small">(${teamRoster().filter(p=>draft.att[p.id]!=="A").length} present)</span></h2><p class="small">Everyone starts Present. Tap to mark Absent – absent students can't be picked for the room.</p>${teamRoster().map(p=>`<div class="li"><span>${esc(p.name)}</span>${attBtns(draft.att[p.id]||"P",`setDraftAtt('${p.id}',X)`)}</div>`).join("")}</div>
 <div class="card"><h2>Travel 8 <span class="small">(${draft.travel.length}/8 in the room)</span></h2><div class="chips">${teamRoster().filter(p=>draft.att[p.id]!=="A").map(p=>{const on=draft.travel.includes(p.id);return `<button class="chip ${on?"on":""} ${!on&&step?"lock":""}" onclick="tg('travel','${p.id}',8)">${esc(p.name)}</button>`}).join("")||'<p class="small">Add students on the Roster tab first.</p>'}</div></div>
 ${step?`<div class="card"><h2>Starting 4 <span class="small">(${draft.start.length}/4)</span></h2><div class="chips">${draft.travel.map(id=>{const on=draft.start.includes(id);return `<button class="chip ${on?"on":""} ${!on&&draft.start.length===4?"lock":""}" onclick="tg('start','${id}',4)">${esc(nm(id))}</button>`}).join("")}</div></div>`:""}
 <button class="pri full" onclick="startMatch()">Start match</button>`}
// Attendance per match: m.attendance = {studentId:"P"|"A"}. Older matches have none: the in-room 8 count as present, others unmarked.
const attBtns=(v,fn)=>`<span class="att"><button class="${v==="P"?"ok":""}" onclick="${fn.replace("X","'P'")}">Present</button><button class="${v==="A"?"bad":""}" onclick="${fn.replace("X","'A'")}">Absent</button></span>`;
function setDraftAtt(id,v){draft.att[id]=v;if(v==="A"){draft.travel=draft.travel.filter(x=>x!==id);draft.start=draft.start.filter(x=>x!==id)}render()}
function attOf(m,id){const a=m.attendance?.[id];if(a)return a;return m.travel.includes(id)?"P":null}
function setMatchAtt(mid,id,v){const m=S.matches.find(x=>x.id===mid);if(v==="A"&&m.travel.includes(id))return alert(`${nm(id)} was in the room for this match, so they can't be marked absent.`);m.attendance??={};m.attendance[id]=v;if(m.pastForm)m.pastForm.att[id]=v;save();render()}
function attTable(){const ms=teamMatches(),n=ms.length;if(!n)return "";const rows=teamRoster().map(p=>{const att=ms.filter(m=>attOf(m,p.id)==="P").length,ab=ms.filter(m=>attOf(m,p.id)==="A").length;return `<tr><td>${esc(p.name)}</td><td><b>${att}/${n}</b></td><td>${ab||""}</td></tr>`}).join("");
 return `<div class="card"><h2>Attendance – season</h2><p class="small">Matches attended out of ${TEAMS[S.team]} matches. Absences don't affect accuracy.</p><table><tr><th>Player</th><th>Attended</th><th>Absent</th></tr>${rows}</table></div>`}
function tg(k,id,max){const a=draft[k];const i=a.indexOf(id);if(i>=0){a.splice(i,1);if(k==="travel")draft.start=draft.start.filter(x=>x!==id)}else if(a.length<max)a.push(id);render()}
function startMatch(){if(!draft.opp.trim())return alert("Enter the opponent.");if(draft.travel.length!==8&&!confirm(`Only ${draft.travel.length} in the room selected. Continue?`))return;if(draft.start.length!==4)return alert("Pick the starting 4.");
 const attendance={};teamRoster().forEach(p=>attendance[p.id]=draft.att[p.id]||"P");const m={id:uid(),opp:draft.opp.trim(),date:draft.date,attendance,travel:[...draft.travel],lineups:[[...draft.start],[]],round:1,q:1,stage:"live",events:[],done:false};m.team=S.team;S.matches.push(m);S.curBy[S.team]=m.id;draft=null;save();render()}
// Lightning: all in-room players may play. At Q16 the coach confirms who is in (default: all in the room).
let lightPick=null;
function vLightPick(m){lightPick??=[...(m.lightLineups?.[m.round-1]||m.travel)];const t=totals(m);
 return `<div class="score"><div>Us<b>${t.us}</b></div><div>${esc(m.opp)}<b>${t.them}</b></div></div>
 <div class="qbar">Round ${m.round} · ⚡ Lightning lineup</div>
 <div class="card"><p class="small">Everyone in the room can play lightning. Uncheck anyone who isn't playing.</p><div class="chips">${m.travel.map(id=>`<button class="chip ${lightPick.includes(id)?"on":""}" onclick="tgLight('${id}')">${lightPick.includes(id)?"☑":"☐"} ${esc(nm(id))}</button>`).join("")}</div></div>
 <button class="pri full" onclick="setLight()">Start lightning (${lightPick.length} players)</button><div style="height:8px"></div><button class="full" onclick="lightPick=null;undo()">↶ Undo last question</button>`}

 ${schDays().map(d=>`<div class="card"><div class="row" style="align-items:center"><input type="date" value="${esc(d.date)}" onchange="schSet('${d.id}','date',this.value)"><button class="bad" style="flex:0 0 auto;min-height:44px;font-size:14px" onclick="schDel('${d.id}')">Delete</button></div>
  <div class="row" style="margin:8px 0">${["V","JV"].map(t=>`<button class="${d["bye"+t]?"opp":""}" style="min-height:44px;font-size:15px" onclick="schSet('${d.id}','bye${t}',${!d["bye"+t]})">${d["bye"+t]?"✓ ":""}${TEAMS[t]} bye</button>`).join("")}</div>
  ${SLOTS.map(([k,a,b])=>{const sl=d.slots[k]||{};const open=!sl.V&&!sl.JV;return `<div class="slot"><div class="slotHead"><b>${k}</b><span class="small">${fmtT(a)}–${fmtT(b)}</span>${["V","JV"].map(t=>`<button class="${sl[t]?"pri":""}" ${d["bye"+t]?"disabled":""} onclick="schTeam('${d.id}','${k}','${t}')">${TEAMS[t]}</button>`).join("")}${open?'<span class="tag" style="background:#eef2f8;color:#5b6678">Open</span>':""}</div>
   ${["V","JV"].filter(t=>sl[t]).map(t=>`<div class="row slotRow"><span class="small" style="flex:0 0 52px"><b>${TEAMS[t]}</b></span><select class="gradeSel" onchange="schField('${d.id}','${k}','${t}','room',this.value)"><option value="">Room…</option>${ROOMS.map(r=>`<option ${sl[t].room===r?"selected":""}>${r}</option>`).join("")}</select><input placeholder="Opponent" value="${esc(sl[t].opp)}" onchange="schField('${d.id}','${k}','${t}','opp',this.value)"></div>`).join("")}</div>`}).join("")}</div>`).join("")}
 <button class="pri full" onclick="addEventDay()">＋ Add competition date</button>`}
function startFromSlot(t,opp){S.team=t;draft=null;tab="match";save();render();if(!M()){draft.opp=opp||"";render()}}
function daySummary(d){return ["V","JV"].map(t=>d["bye"+t]?`${TEAMS[t]}: bye`:`${TEAMS[t]}: ${SLOTS.filter(([k])=>d.slots[k]?.[t]).length} match${SLOTS.filter(([k])=>d.slots[k]?.[t]).length===1?"":"es"}`).join(" · ")}
function vEventCard(){const today=todayKey(),d=S.schedule.find(x=>x.date===today);
 if(!d){const nx=schDays().find(x=>x.date&&x.date>today);return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">📅 Next event</h2><button style="min-height:40px;font-size:14px" onclick="tab='schedule';render()">Schedule</button></div><p style="margin:8px 0 0">${nx?`<b>${fmtDate(nx.date)}</b> – ${daySummary(nx)}`:'<span class="small">No upcoming competition dates. Add them on the Schedule screen.</span>'}</p></div>`}
 const now=new Date(),nm=now.getHours()*60+now.getMinutes();const cur=SLOTS.find(([,a,b])=>nm>=toMin(a)&&nm<toMin(b)),nxt=SLOTS.find(([,a])=>toMin(a)>nm);
 return `<div class="card todayCard"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">📍 Today's schedule</h2><button style="min-height:40px;font-size:14px" onclick="tab='schedule';render()">Edit</button></div><p class="small" style="margin:4px 0 8px">${fmtDate(d.date)} · ${daySummary(d)}</p>
 ${SLOTS.map(([k,a,b])=>{const sl=d.slots[k]||{},mark=cur&&cur[0]===k?"now":(!cur&&nxt&&nxt[0]===k)||(cur&&nxt&&nxt[0]===k)?"next":"";const ts=["V","JV"].filter(t=>sl[t]);
  return `<div class="tslot ${mark}"><div class="tsHead"><b>${k}</b> <span>${fmtT(a)}–${fmtT(b)}</span>${mark?`<span class="tag ${mark==="now"?"tin":""}" style="${mark==="next"?"background:#e3eeff;color:#1f3a5f":""}">${mark==="now"?"NOW":"NEXT"}</span>`:""}</div>
  ${ts.length?ts.map(t=>`<div class="tsRow"><span><b>${TEAMS[t]}</b> · ${esc(sl[t].room||"room ?")}${sl[t].opp?` · vs ${esc(sl[t].opp)}`:""}</span><button class="pri" onclick="startFromSlot('${t}',${esc(JSON.stringify(sl[t].opp||""))})">▶ Start this match</button></div>`).join(""):'<div class="small">Open – no match for us</div>'}</div>`}).join("")}</div>`}
function render(){$("#teamSw").innerHTML=Object.entries(TEAMS).map(([k,l])=>`<button class="${S.team===k?"on":""}" onclick="setTeam('${k}')">${l}</button>`).join("");const m=M();$("#app").innerHTML=tab==="home"?vHome():tab==="roster"?vRoster():tab==="match"?vMatch():tab==="practice"?vPractice():tab==="reports"?vReports():tab==="schedule"?vSchedule():vStats();
 $("#nav").innerHTML=[["home","🏠 Home"],["roster","👥 Roster"],["match",m&&!m.done?"🔴 Live":"🏁 Match"],["practice","📝 Practice"],["stats","📊 Stats"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("")}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
