<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meeting Buddy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sunday Meeting Buddy</title>
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#1a2236;--muted:#667085;--accent:#6d5dfc;--gold:#e8b423;--good:#1f9d5b;--bad:#d24b4b;--line:#d7deea;--soft:#f3efff;--yellow:#fff4c4}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{overscroll-behavior:none}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.app{height:100dvh;display:flex;flex-direction:column;min-height:100vh}
.top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);z-index:20}
.brand{font-weight:900;font-size:15px;white-space:nowrap}
.top .grow{flex:1}
.chip,.toolBtn,.stars{border-radius:999px;padding:7px 10px;font-weight:800;font-size:13px;border:1px solid #ddd8ff;background:#f3f1ff;color:#4c43b8}
.stars{background:#fff6d8;border-color:#efd27b;color:#7a5a00}
.timerChip{font-variant-numeric:tabular-nums;background:#e9f8ef;border-color:#bfe8cf;color:#1f7a46}
.timerChip.ready{background:#efeaff;border-color:#c9c2ff;color:var(--accent)}
.testBanner{background:#fff3cc;text-align:center;padding:5px;font-weight:800;font-size:12px;color:#775600}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px;gap:8px}
.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 16px;text-align:center;margin:auto;width:min(560px,100%)}
.hero h1{font-size:30px;margin:6px 0 8px}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#6257d4;font-weight:900}
.field{text-align:left;margin:10px 0}
.field label{display:block;font-weight:800;margin-bottom:5px;font-size:13px}
.field input,textarea{width:100%;border:1px solid #cfd6e2;border-radius:12px;padding:11px;background:#fff}
.primary,.secondary{border-radius:12px;padding:11px 14px;font-weight:900}
.primary{background:var(--accent);color:#fff}
.secondary{background:#efefff;color:#4c43b8}
.ghost{background:transparent;color:var(--muted);padding:8px}
.source{color:var(--muted);font-size:13px;line-height:1.4}
.talkGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
.talkPrompt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;min-height:0}
.talkPrompt h3{margin:0 0 6px;font-size:14px}
.talkPrompt textarea{flex:1;min-height:80px}
.lock{background:#fff;border:1px dashed #c9d1e0;border-radius:14px;padding:12px;text-align:center}

/* Watch layout: fill the screen */
.watch{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,1.05fr) auto;gap:8px}
.watchHead{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.watchHead h2{font-size:15px;margin:0}
.meta{font-size:12px;color:var(--muted)}
.progress{height:6px;background:#e7eaf1;border-radius:99px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--accent)}
.pane{background:#fff;border:1px solid var(--line);border-radius:14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.paneBar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.paneBody{flex:1;min-height:0;overflow:auto;padding:10px}
.toggle{display:flex;background:#eef0f5;border-radius:10px;padding:3px}
.toggle button{padding:6px 10px;border-radius:8px;background:transparent;color:var(--muted);font-weight:800;font-size:13px}
.toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hlTools{display:flex;gap:5px;margin-left:auto;align-items:center}
.hlDot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c5cdd8}
.hlDot.on{box-shadow:0 0 0 2px #182033}
.mark{cursor:pointer;border-radius:4px;padding:0 1px}
.mark.y{background:#ffe56a}
.mark.g{background:#b6f0c8}
.mark.p{background:#ffc2e2}
.mark.b{background:#c9dbff}
.actualText,.easy{font-size:16px;line-height:1.55}
.easy{background:var(--soft);border-radius:10px;padding:8px}
.foot{display:flex;gap:8px;align-items:stretch}
.qbar{flex:1;background:#fff8df;border:1px solid #f1dda4;border-radius:14px;padding:8px 10px;min-width:0}
.qbar strong{display:block;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#8a6a10}
.qbar .qprompt{font-weight:750;font-size:13px;line-height:1.3;margin:2px 0 6px}
.qbar textarea{min-height:44px;padding:8px;border-radius:10px}
.nextCol{display:flex;flex-direction:column;gap:6px;width:118px}
.nextCol .primary{height:100%;min-height:52px}

/* Games */

.playPrompt{font-weight:800;font-size:15px;line-height:1.35;margin:0 0 8px}
.sky{position:relative;min-height:230px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 120%,#ffe9a8 0 18%,#9ec7ff 18% 55%,#3a4d9a 55%)}
.floater{position:absolute;border:0;border-radius:18px;padding:9px 11px;font-weight:900;background:#fff;box-shadow:0 8px 18px rgba(20,30,50,.18);animation:drift 3.4s ease-in-out infinite;touch-action:manipulation}
.floater.got{background:#fff4a8;box-shadow:0 0 18px 6px rgba(255,220,80,.75);animation:none}
.floater.boom{background:#ffd0d0}
.floater.boom{background:#ffd0d0;animation:shake .35s}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(10px,-16px) rotate(3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.gridTap{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bigHit{min-height:58px;border-radius:16px;border:2px solid #d5dceb;background:#fff;font-weight:900;font-size:15px;padding:10px}
.bigHit.on{background:#ece8ff;border-color:#8b82e8}
.sortStage{display:grid;gap:8px}
.sortCard{min-height:88px;border-radius:18px;border:2px solid #cfd6ea;background:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;padding:12px}
.sortBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sortBtns button{min-height:72px;border-radius:16px;font-weight:900;font-size:16px}
.factBtn{background:#eef3ff;border:2px solid #b9c7ee;color:#2a3d86}
.heartBtn{background:#fff0f4;border:2px solid #f3b4c4;color:#9b2c4a}
.path{position:relative;min-height:150px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:linear-gradient(#cfe8ff,#d9efc8);border-radius:16px;padding:12px}
.stone{width:96px;min-height:96px;border-radius:50%;border:4px solid #c4b48a;background:#f3e6b8;font-weight:900;font-size:12px;padding:8px;line-height:1.2}
.stone .ico{font-size:26px;display:block}
.stone.lit{background:#ffe56a;border-color:#d4a000;transform:scale(1.05)}
.towerBox{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:end}
.tower{display:flex;flex-direction:column-reverse;align-items:center;min-height:200px;padding-bottom:8px;background:linear-gradient(#f4f7ff,#e4ebf8);border-radius:14px;border:1px solid #d5dceb}
.brick{color:#fff;font-weight:900;text-align:center;padding:10px 8px;margin-top:4px;border-radius:6px;background:linear-gradient(#c27a4a,#8b4b28);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 #6a3418;font-size:13px}
.brick.b0{width:118px}.brick.b1{width:100px}.brick.b2{width:84px}.brick.b3{width:70px}
.pile{display:grid;gap:6px}
.lensDesk{display:grid;grid-template-columns:1.2fr .8fr;gap:8px}
.pageFake{background:#fffaf0;border:1px solid #e3d6b3;border-radius:8px;padding:10px;font-size:13px;line-height:1.45;min-height:120px}
.lenses{display:grid;gap:8px}
.lens{border-radius:50%;width:100%;aspect-ratio:1;max-height:84px;border:8px solid #333;background:radial-gradient(circle at 35% 30%,#fff,#7db7ff 35%,#1d3b73);color:#fff;font-weight:900;font-size:11px;text-shadow:0 1px 2px #000}
.lens.on{outline:4px solid #6d5dfc}
.mags{display:flex;flex-direction:column;gap:10px;align-items:center}
.mag{width:118px;min-height:118px;border-radius:50%;border:10px solid #6b4423;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8),rgba(140,200,255,.35) 42%,rgba(60,110,170,.28));color:#123;font-weight:900;font-size:11px;line-height:1.2;padding:16px;position:relative}
.mag:after{content:"";position:absolute;width:16px;height:40px;background:#6b4423;border-radius:8px;right:-16px;bottom:-26px;transform:rotate(-38deg)}
.mag.on{box-shadow:0 0 0 4px #6d5dfc}
.pageOn{position:relative}
.pageOn .magSit{position:absolute;right:8px;bottom:8px;transform:scale(.7)}
.rocketPad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rocketHole{min-height:86px;border:2px dashed #c9d1e0;border-radius:16px;background:#f4f7ff;padding:8px;font-weight:800;text-align:center}
.decide{display:flex;gap:8px;margin-top:8px}
.decide button{flex:1;min-height:48px;border-radius:14px;font-weight:900}
.yesT{background:#e5f8ea;color:#16653c}
.noT{background:#fff1f1;color:#8a3030}
.jeans{display:grid;grid-template-columns:1fr 160px;gap:10px;align-items:start}
.polaroid{background:#fff;border:1px solid #ddd;box-shadow:0 4px 10px rgba(0,0,0,.08);padding:8px 8px 18px;font-weight:800;font-size:13px;text-align:center;transform:rotate(var(--r,0deg))}
.polaroid .pic{font-size:28px;display:block;margin-bottom:4px}
.jeanPocket{height:180px;border-radius:12px 12px 40px 40px;background:linear-gradient(#3c5a86,#2a4064);border:3px dashed #c9d6ea;color:#e8eef8;padding:12px;position:relative}
.jeanPocket:before{content:"";position:absolute;left:12px;right:12px;top:34px;height:8px;border-top:2px dashed #9fb3d1}
.tossBin{margin-top:8px;min-height:44px;border-radius:12px;border:2px dashed #d9b0b0;background:#fff5f5;padding:8px;font-weight:800;color:#8a3030}
.mirrorScene{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center}
.oval{width:150px;height:190px;border-radius:50%;border:10px solid #c9a227;background:linear-gradient(180deg,#eef7ff,#c8d8e8);box-shadow:inset 0 0 20px rgba(30,50,80,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
.sticker{border-radius:14px;padding:8px;background:#fff;border:2px solid #d5dceb;font-weight:800}
.sticker.on{background:#d9f6e4;border-color:#49b877}
.sticker.no{background:#ffe1e1}
.mapScene{position:relative;height:220px;border-radius:16px;background:linear-gradient(#b5e0a8 0 55%,#8ecf7a 55%);overflow:hidden;border:1px solid #c3ddb8}
.mapScene .road{position:absolute;left:0;right:0;top:52%;height:18px;background:#e8d9a8}
.pin{position:absolute;padding:6px 8px;border-radius:14px;background:#fff;font-weight:800;font-size:12px;border:2px solid #d5dceb}
.pin.on{background:#ffe56a;border-color:#e0b000}
.pin.bad{background:#ffe1e1}
.well{position:relative;height:230px;border-radius:16px;background:linear-gradient(#6b7c8d,#2b3640);overflow:hidden}
.wellWall{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 12px,transparent 12px 24px)}
.rope{position:absolute;left:50%;width:6px;background:#c9a36a;top:0;height:20%;transform:translateX(-50%)}
.person{position:absolute;left:calc(50% - 16px);bottom:10px;font-size:28px;filter:brightness(.7)}
.hideTok{position:absolute;background:rgba(255,255,255,.16);border:0;border-radius:10px;padding:4px 6px;font-size:16px;color:#fff}
.hideTok.found{background:#d9f6e4;color:#16653c}
.quadDraw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pad{border:1px solid #d5dceb;border-radius:12px;padding:6px;background:#fafbff}
.pad canvas{width:100%;height:88px;background:#fff;border-radius:8px;border:1px dashed #c9d1e0;touch-action:none}
.trackRow{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.trackIco{font-size:28px;text-align:center}
.slot{min-height:48px;border:2px dashed #c9d1e0;border-radius:12px;padding:8px;font-weight:800;background:#f7f8fc}
.slot.filled{background:#ece8ff;border-color:#8b82e8}
.picCard{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid #d5dceb;font-weight:800;margin:4px}
.garden{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.plant{min-height:100px;border-radius:16px;background:#e7f6ea;border:2px dashed #b7d8bf;font-weight:900}
.plant.up{background:#b9ecc6;border-style:solid}
.tile{min-height:58px;border-radius:12px;border:2px solid #d5dceb;background:#fff;font-weight:900}
.tile.flip{background:#6d5dfc;color:#fff}
.tile.found{background:#d9f6e4;border-color:#49b877;color:#16653c}
.small{font-size:12px;color:var(--muted)}


.sheet{position:fixed;inset:0;background:#111;z-index:80;display:none;flex-direction:column}
.sheet.open{display:flex}
.sheetBar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#1a2236;color:#fff}
.sheetBar strong{flex:1;font-size:16px}
.sheetBar button{min-height:48px;min-width:96px;border-radius:14px;font-weight:900;background:#fff;color:#1a2236}
.sheetFrame{flex:1;border:0;width:100%;background:#333}
.holdBtn{width:100%;min-height:52px;border-radius:14px;background:#efeaff;color:#4c43b8;font-weight:900;position:relative;overflow:hidden}
.holdBtn span{position:relative;z-index:1}
.holdBtn .fill{position:absolute;inset:0 auto 0 0;width:0;background:#c9c2ff}
.jumpSel{border:1px solid #cfd6e2;border-radius:12px;padding:10px 12px;font-weight:800;background:#fff;min-height:44px}
.watchHead .jumpSel{min-height:40px;padding:6px 8px;font-size:13px}

/* Brutus dock + chat */
.brutusDock{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid #d9d2ff;padding:0;background:#efeaff;flex:0 0 auto}
.brutusDock img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.chat{position:fixed;inset:auto 8px 8px 8px;max-width:520px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(20,30,50,.2);z-index:80;display:none;flex-direction:column;max-height:52dvh}
.chat.open{display:flex}
.chatHead{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.chatHead img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 18%}
.chatLog{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:90%;padding:8px 10px;border-radius:14px;font-size:14px;line-height:1.35}
.bubble.me{align-self:flex-end;background:#6d5dfc;color:#fff}
.bubble.dog{align-self:flex-start;background:#f3efff}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 8px}
.chipAsk{background:#f3f1ff;border-radius:999px;padding:6px 10px;font-weight:800;font-size:12px;color:#4c43b8}
.chatForm{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.chatForm input{flex:1;border:1px solid #cfd6e2;border-radius:12px;padding:10px}

/* Draw */
.drawOverlay,.pop{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:100;display:none;padding:10px}
.drawOverlay.open,.pop.open{display:flex}
.drawPanel{background:#fff;border-radius:16px;max-width:1100px;width:100%;height:100%;margin:auto;display:flex;flex-direction:column;overflow:hidden}
.drawHead,.drawFoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawFoot{border-top:1px solid var(--line);border-bottom:0}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccd2dd}
.drawCanvasWrap{flex:1;background:#fff;touch-action:none}
.drawCanvasWrap canvas{display:block;width:100%;height:100%;touch-action:none}
.popCard{background:#fff;border-radius:20px;max-width:420px;width:100%;margin:auto;padding:22px 18px;text-align:center}
.popCard h2{margin:8px 0}
.popFace{width:88px;height:88px;border-radius:50%;object-fit:cover;object-position:50% 18%;margin:0 auto}

.finish{background:#fff;border-radius:16px;padding:28px 16px;text-align:center;margin:auto;width:min(560px,100%)}
.finishStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:#f7f8fb;border-radius:12px;padding:12px;font-weight:850}

@media(max-width:700px){.talkGrid{grid-template-columns:1fr}.watch{grid-template-rows:auto minmax(0,.9fr) minmax(0,1.2fr) auto}.nextCol{width:96px}}

[data-theme="sun"]{--bg:#fff6e8;--card:#fff;--ink:#3b2a14;--accent:#e07a2f;--soft:#ffe9c8}
[data-theme="forest"]{--bg:#e7f3ea;--card:#fff;--ink:#16301c;--accent:#2f8f4e;--soft:#d7f0de}
[data-theme="ocean"]{--bg:#e4f3fb;--card:#fff;--ink:#123044;--accent:#1c7ea8;--soft:#d5eef8}
[data-theme="night"]{--bg:#1b2030;--card:#262c40;--ink:#eef2ff;--accent:#8b82ff;--soft:#323a55;--line:#3a4258;--muted:#9aa3b8}
[data-theme="night"] .top,[data-theme="night"] .pane,[data-theme="night"] .watchHead,[data-theme="night"] .hero,[data-theme="night"] .finish{background:var(--card);color:var(--ink)}
[data-font="round"] body{font-family:"Trebuchet MS","Avenir Next",sans-serif}
[data-font="serif"] body{font-family:Georgia,"Times New Roman",serif}
[data-bg="dots"] body{background-image:radial-gradient(#0001 1px,transparent 1px);background-size:14px 14px}
[data-bg="stripes"] body{background-image:repeating-linear-gradient(135deg,#00000008 0 12px,transparent 12px 24px)}
.holdNote{background:#fff4d6;border:1px solid #efd27b;border-radius:12px;padding:10px;font-weight:800;margin:8px 0}
.kid{width:120px;height:180px;margin:8px auto;position:relative}
.kid .body{position:absolute;inset:40px 28px 8px;background:#f2c9a0;border-radius:40px}
.kid .head{position:absolute;top:0;left:28px;right:28px;height:70px;background:#f2c9a0;border-radius:50%}
.kid.s1 .body{background:#f7d7b8}.kid.s2 .body{height:auto;bottom:20px}.kid.s3{filter:saturate(1.2)}.kid.s4{filter:drop-shadow(0 0 8px #e8b423)}
.tileMix{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mix{border-radius:12px;padding:10px 12px;background:#fff;border:2px solid #d5dceb;font-weight:800}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:120px}
.basket{border:2px dashed #c9d1e0;border-radius:14px;padding:8px;min-height:110px;background:#f7f8fc}
.basket.ok{background:#e7f8ee;border-color:#49b877}
.door{margin-top:8px;min-height:64px;border-radius:16px;background:linear-gradient(#c9a227,#8a7014);color:#fff;font-weight:900}
.slots{display:grid;gap:8px}
.slotBox{min-height:48px;border:2px dashed #c9d1e0;border-radius:12px;padding:8px;font-weight:800}
.personLite{position:relative;height:200px;background:linear-gradient(#eef3ff,#f7f8fc);border-radius:16px}
.spot{position:absolute;width:54px;height:54px;border-radius:50%;border:3px dashed #bcc6d8;display:grid;place-items:center;font-weight:900;font-size:11px;background:#fff}
.spot.lit{background:#ffe56a;border-color:#e0b000}
.hideScene{position:relative;height:240px;border-radius:16px;background:linear-gradient(#cfe4ff 0 42%,#efe3c4 42% 70%,#d7efc8 70%);overflow:hidden;border:1px solid #d5dceb}
.hideHot{position:absolute;border:0;background:transparent;font-size:28px;padding:0}
.cockpit{background:#1b2436;color:#e8eef8;border-radius:16px;padding:10px}
.planeFly{position:relative;height:180px;background:linear-gradient(#87b7e8,#eaf4ff);border-radius:14px;overflow:hidden}
.bird{position:absolute;left:30px;width:36px;height:22px;background:#6d5dfc;border-radius:20px 20px 8px 8px}
.gate{position:absolute;width:18px;background:#1f9d5b}
.cw{display:grid;gap:2px;justify-content:center}
.cw input{width:28px;height:28px;text-align:center;font-weight:900;border:1px solid #cfd6e2;border-radius:6px;text-transform:uppercase}
.madline{line-height:1.7;font-size:16px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid #6d5dfc;padding:0 6px;font-weight:900}
.lensesPretty{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lensCard{border-radius:18px;min-height:120px;padding:10px;border:4px solid #c9a227;background:radial-gradient(circle at 30% 20%,#fff,#d7c2ff 40%,#8b82e8)}
.den{height:160px;border-radius:16px;background:radial-gradient(circle at 50% 80%,#3b2a1a,#1a120c);position:relative}
.starsGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.starCell{aspect-ratio:1;border-radius:8px;border:1px solid #d5dceb;background:#fff}
.starCell.on{background:#ffe56a}
.starCell.fix{background:#efd27b}
.maze{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mz{min-height:44px;border-radius:10px;background:#eef3ff;font-weight:800;font-size:11px}
.mz.here{outline:3px solid #6d5dfc}
.mz.goal{background:#d9f6e4}
.diffWrap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.diffPic{position:relative;height:220px;border-radius:14px;border:1px solid #d5dceb;overflow:hidden}
.diffHot{position:absolute;width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:transparent}
.diffHot.found{border-color:#1f9d5b;background:#1f9d5b55}
.puz{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:360px;margin:auto}
.puzPiece{aspect-ratio:1;border-radius:6px;border:1px dashed #c9d1e0;background:#f3efff;font-size:20px}
.ws{display:grid;gap:1px;justify-content:center}
.ws span{width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:800;border-radius:3px}
.ws span.on{background:#ffe56a}
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chest{min-height:90px;border-radius:14px;background:#8b5a2b;color:#fff;font-weight:900;padding:8px}
.chest.open{background:#1f9d5b}
.bins{display:grid;gap:8px}
.bin{border:2px dashed #c9d1e0;border-radius:14px;padding:8px;min-height:70px}
.shopWrap{display:grid;grid-template-columns:160px 1fr;gap:12px}
.buddyStage{position:relative;width:150px;height:180px}
.buddyStage img.base{width:150px;height:180px;object-fit:cover;object-position:50% 18%;border-radius:18px}
.layer{position:absolute;pointer-events:none}
.shopItem{border:1px solid #d5dceb;border-radius:12px;padding:8px;background:#fff;font-weight:800}
.shopItem.have{outline:2px solid #1f9d5b}
.toastHold{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1a2236;color:#fff;padding:12px 16px;border-radius:14px;z-index:120;max-width:90%;font-weight:800;display:none}
.toastHold.show{display:block}

/* Week games (games/*.html) run in an iframe that fills the Play pane */
#playPane.hasGame{padding:0;overflow:hidden}
.gameFrame{display:block;width:100%;height:100%;border:0;background:#fff}
.watch.gameOn{grid-template-rows:auto minmax(0,.55fr) minmax(0,1.45fr) auto}
.watch.gameOn.gameBig{grid-template-rows:auto minmax(0,1fr) auto}
.watch.gameBig>.pane:nth-child(2){display:none}
</style>
</head>

const pTexts={
1:`FROM the moment we decide to serve Jehovah, Satan and his demons become our unrelenting enemies. But Satan knows that he cannot overpower us as long as we have Jehovah’s support. So the Devil tries to undermine that support by getting us to turn our back on Jehovah. One way he does this is by trying to make us doubt that Jehovah and his Son are truly on our side.—2 Cor. 11:14; Jas. 1:6.`,
2:`In the midst of a battle, soldiers need to have confidence in their leaders. If they were to lose that confidence, they might act independently. This could cost them their lives. In a similar way, we are soldiers in a spiritual battle against “wicked spirit forces.” (Eph. 6:12) Satan the Devil knows that if we lose confidence in Jehovah God and in Jesus Christ, we will likely reject their lead and support. So he does all he can to weaken our confidence in them. In this article, we will examine how he used this tactic in the past and how he is still using it today. Then we will consider how we can resist his schemes. In the next article, we will examine two other tactics Satan uses against us in our spiritual warfare.`,
3:`Early in human history, Satan set out to turn Adam and Eve away from Jehovah. Satan deceived Eve into believing that her Creator did not have her best interests at heart. Satan asked her: “Did God really say that you must not eat from every tree of the garden?” (Gen. 3:1-5) Satan convinced Eve that Jehovah was imposing unreasonable limits on both her and her husband. Sadly, Eve and later Adam sided with the enemy Satan. They turned their back on Jehovah—the One who had given them everything.—Gen. 3:6.`,
4:`Since the time of Adam and Eve, Satan has continued to misrepresent Jehovah. For example, Satan incited Job’s false friends to move Job to doubt that Jehovah loved him and valued his faithful course. (Job 22:1-3) The Devil assumed that personal tragedies would cause Job to reject Jehovah. Although Job was under great pressure from Satan’s scheme, that faithful man maintained his integrity, never losing sight of his friendship with God.—Job 27:1, 5.`,
5:`Centuries later when Jesus came to the earth, Satan tried to prevent people from following Jesus. One way he did this was by inciting hateful religious leaders and others to spread lies about Jesus. And in the end, they had him executed as a common criminal.—Read Matthew 11:19; 27:27-31; Mark 14:55, 56; John 8:41-45.`,
6:`After Jesus’ death, Satan turned his attention to the work of Jesus’ followers. First, the Devil tried to introduce doubts about Jesus’ resurrection. Under Satan’s influence, a false story circulated that Jesus’ disciples had stolen his body. (Matt. 28:11-15) Then during the days that followed, Satan tried to intimidate the congregation by means of persecution. Satan wanted to make the work that their Master had entrusted to them appear too difficult for them to carry out.—Acts 7:57–8:1; 12:1-3; 28:22.`,
7:`Although some of the early Christians gave in to this pressure to stop preaching, most stood firm and refused to keep silent. They recognized that Satan and the demons were their real enemies. (Acts 4:18-20; 1 Pet. 5:8) What about today? What tactics is Satan using to try to discourage us from serving Jehovah?`,
8:`Today, one of Satan’s main tactics is to obscure the truth about Jehovah and about Jesus. As “the father of the lie,” the Devil spreads lies about them by means of false religion. (John 8:44) For example, he has blinded people about the true identity of Jehovah and of his Son. (2 Cor. 4:3, 4) Christendom often presents the Father and the Son as being equal. As a result, people tend to ignore the Father, whose name they do not know, and worship the Son. Neither Jehovah nor Jesus approves of such worship. (Matt. 4:10; John 4:23) When people are blinded in such ways, they may be difficult to reason with or may even oppose our ministry.`,
9:`When we start a relationship, one of the first things we do is learn the person’s name. Satan seeks to prevent people from having a close friendship with Jehovah by keeping them from even knowing His name. Thus, Satan has long used false religion to make people forget God’s name. (Read Jeremiah 23:26, 27.) That enemy has even made sure that God’s name—which the Bible likens to a strong, protective tower—is omitted from many translations of the Bible. (Prov. 18:10) The Devil is also behind the lie that Jehovah causes suffering. As a result, sincere people may struggle to see Jehovah as a Friend they can draw close to. (Jas. 4:8) However, Satan also seeks to undermine the faith of Jehovah’s people.`,
10:`When we are going through personal challenges, Satan wants us to believe that Jehovah doesn’t care about us. Satan hopes that we will become angry if Jehovah allows our suffering to continue. (Prov. 19:3) Those who begin to feel this way may even wonder: ‘What is the point of continuing to follow Jehovah’s laws and principles? It doesn’t seem to benefit me!’ This type of thinking could lead us to come under Satan’s influence.`,
11:`Satan uses such tools as social media to raise doubts about Jehovah’s standards. On these platforms, many people express the view that the moral values found in the Bible are outdated and that everyone should be free to set his own standards. Most certainly, “the ruler of the world” has been very skilled at blurring the lines between what is good and what is bad.—John 14:30; Isa. 5:20; 1 Tim. 4:1, 2.`,
12:`Listening to Satan’s propaganda could cause us to drift away from Jehovah. A young sister whom we will call Shannon relates: “It took me a while to realize that the morals I was being taught in school and the people I was associating with were distorting my sense of right and wrong. The more time I spent on social media, the more I wanted to copy the values of those I met online. I gradually began to drift away from Jehovah, my family, and my brothers and sisters.” Eventually, Shannon found her way back to her heavenly Father and escaped from the Devil’s snare. What helped her?`,
13:`Shannon realized that she needed to work hard to remain friends with Jehovah and Jesus. She says: “I prayed and worked in harmony with my prayers by doing research in our publications. The video Young People Ask—How Can I Make Real Friends? helped me a lot. In that dramatization, a young sister was experiencing many of the same challenges that I was. She humbly turned to her parents and asked for help. I did the same. My parents, the elders, and mature Christian sisters in the congregation helped me to break free from my bad association. I came to understand that the truth is not only about going to meetings and pleasing my parents but about making the truth my own and maintaining a close personal relationship with Jehovah.”`,
14:`To remain friends with Jehovah, we must choose our associates wisely. (Jas. 4:4) We should also be careful not to believe everything we read or hear that is put out by the world. For instance, we could draw wrong conclusions if we believed material that consisted of half-truths or outright lies. But if we study the Bible and our publications and regularly associate with mature Christians, we will not be easily swayed. The better we know the truth, the more likely we will be to succeed in rejecting Satan’s attempts to weaken our faith.—Prov. 13:20; Acts 17:11.`,
15:`By examining the Bible carefully, we can build our confidence that Jehovah and Jesus are on our side. (Prov. 22:19) As we meditate on accounts that show how much Jehovah and Jesus care for humans, we will be moved to count on them as reliable friends. The Bible is filled with reassurances that Jehovah and Jesus love us. For example, Jehovah describes his feelings for his people as being stronger than those of a nursing mother for her child. (Isa. 49:15) He considers any who cherish his name as “a treasured possession.” (Mal. 3:16, 17, ftn.) And the Bible reveals the depth of Jesus’ love for us by recording his sentiments about his sacrifice.—John 15:12, 13.`,
16:`Reflecting on the support that Jehovah and Jesus give us today can also help us to become convinced of their love for us. We can remind ourselves of times when we felt that Jehovah was near, and we can draw strength from those memories. We can also ask our brothers and sisters how they have experienced this help. (Prov. 22:17) By doing so, we will build our confidence that whatever challenges we face, Jehovah and Jesus are on our side.—Read Psalm 118:5, 6.`,
17:`We all want to remain close friends of Jehovah God and Jesus Christ. But until Satan and his demons are destroyed forever, we will need to contend with their attempts to weaken our confidence in Jehovah and in Jesus. (Rev. 20:1-3, 10) To resist our enemies’ tactics, we must maintain a close personal relationship with Jehovah and remain convinced that he and his dear Son love and value us. Then, as Jesus said, no one will be able to “snatch [you] out of the hand of the Father.”—Read John 10:29; Jas. 4:7.`,
18:`In the following article, we will examine two other tactics Satan uses against us during our spiritual warfare—attempts to cause division within the congregation and opposition from the outside. How can we successfully fight against these? We shall see.`

function emojiPiece(n){return ['👧','🏫','📘','💛','☀️','🌳','✏️','🙂','🙏','⭐','🌈','🏠','🎵','✋','💧','🌸','🐦','🚪','🌟','✅'][n]}
function defaultStars(){
  // 6x6, 1=player, 2=fixed gift. Two per some rows prefilled.
  const g=Array(36).fill(0);
  const fixed=[0,5, 8,11, 13,16, 20,23, 25,28, 30,35]; // a spaced pair pattern (cols 0+5, 2+5? )
  // simpler easy: pre-place 8 gifts in a valid no-edge-adjacent 2-per-row pattern
  const places=[0,3, 7,10, 13,16, 20,23, 25,28, 30,33];
  places.forEach((p,i)=>{if(i<8)g[p]=2});
  return g;
}
function makeWS(words){
  const n=12, grid=Array.from({length:n},()=>Array(n).fill(''));
  const dirs=[[1,0],[0,1],[1,1]];
  words.forEach(w=>{
    for(let t=0;t<40;t++){
      const d=dirs[t%3], r=Math.floor(Math.random()*n), c=Math.floor(Math.random()*n);
      const er=r+d[0]*(w.length-1), ec=c+d[1]*(w.length-1);
      if(er<0||er>=n||ec<0||ec>=n) continue;
      let ok=true;
      for(let i=0;i<w.length;i++){
        const ch=grid[r+d[0]*i][c+d[1]*i];
        if(ch && ch!==w[i]) {ok=false;break}
      }
      if(!ok) continue;
      for(let i=0;i<w.length;i++) grid[r+d[0]*i][c+d[1]*i]=w[i];
      return;
    }
  });
  const abc='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(!grid[r][c]) grid[r][c]=abc[Math.floor(Math.random()*26)];
  return grid;
}
function chestKeys(step){
  const real=[['happiest life today','Psalm 25'],['eternal life','1 John 5:20'],['known by him','1 Corinthians 8:3']];
  const decoy=['famous','rich','first in line','everybody notices me'];
  return step>2?[]:[...real[step],...decoy];
}

function attemptResult(key,correct,keepPlay){
  if(state.activityStars[key]!==undefined){
    popup(true,'Already finished','You already did this one. Reset if you just want to play again — no extra stars.');
    return;
  }
  state.attempts[key]=(state.attempts[key]||0)+1;
  const n=state.attempts[key];

      const g=gobj(key); g.diff=g.diff||[]; const i=+b.dataset.d;
      if(!g.diff.includes(i)) g.diff.push(i);
      const lines=['Unity matters','Look at good qualities','John 3:16 — he sacrificed for them','Smile instead of a scowl','Sit together','A help instead of a cold shoulder','Hello seen','Hands open','Warm wall','Same meeting, different eyes'];
      holdExplain(lines[i]||'Found one.');
      save();
      if(g.diff.length>=10) setTimeout(()=>attemptResult(key,true),2000);
      else render();
    });
  }
  if(a.type==='puzzle20'){
    let sel=null;
    document.querySelectorAll('[data-pz]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.pz, g=gobj(key);
      if(sel===null){sel=i;b.style.outline='3px solid #6d5dfc'}
      else {
        const t=g.puz[sel]; g.puz[sel]=g.puz[i]; g.puz[i]=t; sel=null; save(); render();
      }
    });
    document.getElementById('checkGame')?.addEventListener('click',()=>{
      const ok=gobj(key).puz.every((n,i)=>n===i);
      if(ok) popup(true,'Together','We make Jehovah happy when we make the right decision.');
      attemptResult(key,ok);
    });
  }
  if(a.type==='wordsearch'){
    let start=null, pick=[];
    document.querySelectorAll('[data-ws]').forEach(el=>el.onpointerdown=()=>{start=el.dataset.ws;pick=[start];el.classList.add('on')});
    document.querySelectorAll('[data-ws]').forEach(el=>el.onpointerenter=()=>{if(!start)return;pick.push(el.dataset.ws);el.classList.add('on')});
    document.addEventListener('pointerup',()=>{
      if(!start) return;
      const g=gobj(key); const grid=g.ws;
      const letters=pick.map(p=>{const [r,c]=p.split(',').map(Number);return grid[r][c]}).join('');
      const rev=letters.split('').reverse().join('');
      const hit=a.words.find(w=>w===letters||w===rev);
      if(hit){g.wf=g.wf||[]; if(!g.wf.includes(hit)) g.wf.push(hit); holdExplain(hit); if(a.words.every(w=>(g.wf||[]).includes(w))) {holdExplain('Besides the facts, we want them to know Jehovah.'); setTimeout(()=>attemptResult(key,true),2000)}}
      start=null; pick=[]; save(); render();
    },{once:true});
  }
  if(a.type==='chests'){
    const need=[['happiest life today','Psalm 25'],['eternal life','1 John 5:20'],['known by him','1 Corinthians 8:3']];
    document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{
      const g=gobj(key); g.got=g.got||[]; const k=b.dataset.key;
      if(['famous','rich','first in line','everybody notices me'].includes(k)){holdExplain('That is not the blessing in the paragraph.');return}
      if(!need[g.step||0].includes(k)){holdExplain('This chest is not that one yet. Now, then later, then known by him.');return}
      if(!g.got.includes(k)) g.got.push(k);
      if(need[g.step||0].every(x=>g.got.includes(x))){
        holdExplain(need[g.step||0].join(' + '));
        g.step=(g.step||0)+1; g.got=[];
        if(g.step>=3){holdExplain('Almighty God notices us and calls us friends.'); setTimeout(()=>attemptResult(key,true),2000)}
        else setTimeout(()=>render(),2000);
      }
      save();
    });
  }
  if(a.type==='reviewbins'){
    let sel=null,sb=0;
    document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{sel=b.dataset.rev;sb=+b.dataset.bin});
    document.querySelectorAll('[data-bin]').forEach(z=>z.onclick=()=>{
      if(!sel) return;
      const want=+z.dataset.bin, g=gobj(key);
      if(want===sb){(g['b'+want]=g['b'+want]||[]).push(sel); g.used=g.used||[]; g.used.push(sel); save();
        if((g.b0||[]).length===3&&(g.b1||[]).length===3&&(g.b2||[]).length===3) attemptResult(key,true);
        else render();
      } else holdExplain('That answers a different question.');
    });
  }
}

function startFly(key){
  const box=document.getElementById('flyBox'), bird=document.getElementById('bird');
  if(!box||!bird) return;
  let y=80, vy=0, xg=180, passed=0, dead=false;
  const tick=()=>{
    if(dead||!document.getElementById('flyBox')) return;
    vy+=0.35; y+=vy;
    if(y<0||y>160){dead=true;holdExplain('Try the little flight again.'); gobj(key).fly=1; return}
    xg-=3; if(xg<-20){xg=220; passed++; if(passed>=4){holdExplain('Now he can decide in any circumstance.'); setTimeout(()=>attemptResult(key,true),2000);return}}
    bird.style.top=y+'px';
    requestAnimationFrame(tick);
  };
  box.onclick=()=>vy=-5;
  tick();
}

function finish(){
  return `<section class="finish">
    <img src="brutus.png" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 18%">

}
function buddyHTML(){

function openShop(){
  const el=document.getElementById('shopOverlay');
  document.getElementById('shopBody').innerHTML=`<div class="shopWrap">${buddyHTML()}<div>
    <p class="small">Stars: ${state.stars}. One item per spot. Different spots can stack.</p>
    ${SHOP.map(it=>{
      const have=(state.owned||[]).includes(it.id);
      const on=state.wear[it.slot]===it.id;
      return `<div class="shopItem ${have?'have':''}">${esc(it.name)} · ${it.slot} · ${it.cost}⭐
        ${have?`<button class="secondary" data-wear="${it.id}">${on?'Take off':'Wear'}</button>`:`<button class="primary" data-buy="${it.id}">Buy</button>`}</div>`;
    }).join('')}</div></div>`;
  el.classList.add('open');
  document.getElementById('closeShop').onclick=()=>el.classList.remove('open');
  document.getElementById('openShop2')?.addEventListener('click',openShop);
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const it=SHOP.find(s=>s.id===b.dataset.buy);
    if(state.stars<it.cost){brutusSay('Need more stars.');return}
    state.stars-=it.cost; state.owned=state.owned||[]; state.owned.push(it.id); save(); openShop();
  });
  document.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{
    const it=SHOP.find(s=>s.id===b.dataset.wear);
    state.wear=state.wear||{};
    if(state.wear[it.slot]===it.id) delete state.wear[it.slot];
    else state.wear[it.slot]=it.id;
    save(); openShop();
  });
}

    <div class="field"><label>Background</label><select id="bgSel">${[['plain','Plain'],['dots','Dots'],['stripes','Stripes']].map(([k,n])=>`<option value="${k}" ${state.bg===k?'selected':''}>${n}</option>`).join('')}</select></div>

function bindHoldEndTalk(){
  const btn=document.getElementById('endTalk'); if(!btn) return;
  const fill=btn.querySelector('.fill'); let t=null;
  const down=e=>{e.preventDefault(); fill.style.transition='width 1.1s linear'; fill.style.width='100%'; t=setTimeout(()=>{state.talkDone=true; state.screen='transition'; save(); render()},1100)};
  const up=()=>{clearTimeout(t); fill.style.transition='width .15s ease'; fill.style.width='0'};

const CHIPS=['What should I do?','I’m bored','What’s this about?','Can I draw?','Good boy','Where is the shop?'];
function brutusReply(q){
  const s=q.toLowerCase();
  const lines=[
    [/shop|dress|bow|hat/, 'Shop is the star button up top. One thing per spot. You can stack a hat and glasses. Not two hats.'],
    [/bored|wiggle/, 'Highlight one sentence. Then Play. I will stay.'],
    [/about|paragraph|article/, 'This week: Satan lies about Jehovah and Jesus. Eve, Job, Jesus, Shannon. Jehovah and Jesus are on your side.'],
    [/draw/, 'Purple pencil. Ink, watercolor, pencil, calligraphy. Pixel eraser and object eraser.'],
    [/good boy|hi brutus|hello/, 'Tail = yes.'],
    [/don’t get|dont get|hard/, 'Switch to Maddy words. Highlight the sticky sentence.'],
    [/star|timer|next/, 'No clock. If I tell you to slow down, stay put. The games should take a while all by themselves.'],
    [/song/, 'Song 55 opens the study. Song 150 closes it. Your talk song is whatever Dad typed.']
  ];
  for(const [re,ans] of lines){if(re.test(s)) return ans}
  return ['Woof. Look at the paragraph, then play.','I heard you. I still do not have thumbs.','Try Maddy words.'][Math.floor(Math.random()*3)];
}
function paintChat(){
  const log=document.getElementById('chatLog'); const chips=document.getElementById('chatChips'); if(!log) return;
  log.innerHTML=(state.chat.length?state.chat:[{who:'dog',t:'Hi. I am Brutus. Shop is up top if you want a bow.'}]).map(m=>`<div class="bubble ${m.who==='me'?'me':'dog'}">${esc(m.t)}</div>`).join('');
  log.scrollTop=log.scrollHeight;
  chips.innerHTML=CHIPS.map(c=>`<button class="chipAsk" data-chip="${esc(c)}">${esc(c)}</button>`).join('');
  chips.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>askBrutus(b.dataset.chip));
}
function askBrutus(text){
  text=String(text||'').trim(); if(!text) return;
  state.chat.push({who:'me',t:text}, {who:'dog',t:brutusReply(text)});
  if(state.chat.length>24) state.chat=state.chat.slice(-24);
  save(); paintChat();
}
document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('chatInput');askBrutus(i.value);i.value=''});
document.getElementById('closeChat').addEventListener('click',()=>document.getElementById('chat').classList.remove('open'));

function openDraw(){document.getElementById('drawOverlay').classList.add('open');setupCanvas()}
function closeDraw(){document.getElementById('drawOverlay').classList.remove('open');saveDrawing()}
function setupCanvas(){
  canvas=document.getElementById('drawCanvas'); if(!canvas) return;
  const r=canvas.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);
  canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
  canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px';
  ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineCap='round'; ctx.lineJoin='round';
  if(drawState.drawing){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=drawState.drawing}
  canvas.onpointerdown=e=>{
    drawing=true; canvas.setPointerCapture(e.pointerId); const p=pos(e); lastX=p.x; lastY=p.y; saveHistory();
    if(drawState.erase==='obj'){eraseNearest(p.x,p.y);return}
    drawState.strokes.push({brush:drawState.brush,color:drawState.color,size:drawState.size,erase:drawState.erase===true,pts:[[p.x,p.y]]});
    stroke(p.x,p.y,p.x,p.y);
  };
  canvas.onpointermove=e=>{if(!drawing||drawState.erase==='obj')return;const p=pos(e);stroke(lastX,lastY,p.x,p.y);lastX=p.x;lastY=p.y;const st=drawState.strokes[drawState.strokes.length-1]; if(st) st.pts.push([p.x,p.y]); saveDrawing()};
  canvas.onpointerup=()=>drawing=false; canvas.onpointercancel=()=>drawing=false;
}
function stroke(x1,y1,x2,y2){
  if(!ctx) return;
  ctx.globalCompositeOperation=drawState.erase===true?'destination-out':'source-over';
  ctx.strokeStyle=drawState.color;
  let w=drawState.size;
  if(drawState.brush==='pencil') {ctx.globalAlpha=.55; w=Math.max(1,w*.6)}
  else if(drawState.brush==='water') {ctx.globalAlpha=.25; w=w*2.2}
  else if(drawState.brush==='calli') {ctx.globalAlpha=1; w=w*1.8}
  else ctx.globalAlpha=1;
  if(drawState.erase===true) w=Math.max(12,w*2);
  ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.globalAlpha=1;
}
function eraseNearest(x,y){
  const st=drawState.strokes; let hit=-1;
  for(let i=st.length-1;i>=0;i--){
    if(st[i].pts.some(([px,py])=>Math.hypot(px-x,py-y)<18)){hit=i;break}
  }
  if(hit>=0){st.splice(hit,1); replayStrokes()}
}
function replayStrokes(){
  if(!ctx||!canvas) return;
  const r=canvas.getBoundingClientRect();
  ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,canvas.width,canvas.height);
  drawState.strokes.forEach(s=>{
    drawState.brush=s.brush; drawState.color=s.color; drawState.size=s.size; drawState.erase=s.erase||false;
    for(let i=1;i<s.pts.length;i++) stroke(s.pts[i-1][0],s.pts[i-1][1],s.pts[i][0],s.pts[i][1]);
  });
  drawState.erase=false; saveDrawing();
}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function saveHistory(){if(canvas){drawState.history.push(canvas.toDataURL('image/png'));if(drawState.history.length>20)drawState.history.shift();drawState.redo=[]}}
function saveDrawing(){if(canvas){drawState.drawing=canvas.toDataURL('image/png');try{localStorage.setItem('smb-drawing-sunday',drawState.drawing)}catch(e){}}}
function clearDraw(){if(!canvas||!ctx)return;saveHistory();ctx.clearRect(0,0,canvas.width,canvas.height);drawState.strokes=[];saveDrawing()}
function undoDraw(){if(!drawState.strokes.length)return;drawState.strokes.pop();replayStrokes()}
function redoDraw(){if(!canvas||!drawState.redo.length)return;const d=drawState.redo.pop();restoreDrawing(d)}
function restoreDrawing(d){const im=new Image();im.onload=()=>{const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,r.width,r.height)};im.src=d}
function saveImage(){
  if(!canvas)return;
  canvas.toBlob(blob=>{
    if(!blob) return;
    const file=new File([blob],'maddys-meeting-drawing.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file],title:'Maddy drawing'}).catch(()=>downloadBlob(blob));
    else downloadBlob(blob);
  },'image/png');
}
function downloadBlob(blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='maddys-meeting-drawing.png'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

PALETTE.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=()=>{drawState.color=c;drawState.erase=false};sw.appendChild(b)});

document.getElementById('newDraw').onclick=()=>{if(confirm('New drawing?')){clearDraw();drawState.history=[];drawState.redo=[]}};
window.addEventListener('resize',()=>{if(document.getElementById('drawOverlay').classList.contains('open'))setupCanvas()});
try{drawState.drawing=localStorage.getItem('smb-drawing-sunday')||null}catch(e){}
if('serviceWorker' in navigator){
  const hadSW=!!navigator.serviceWorker.controller, bootAt=Date.now();
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
  // A new version was installed: reload once if we just launched or are on setup, so the iPad does not stay on the old cached copy.
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!window._swReloaded&&(Date.now()-bootAt<15000||state.screen==='setup')){window._swReloaded=1;location.reload()}});
}
load();
if(state.screen==='transition' && !state.talkDone && !state.test){state.screen='talk'; save()}
paintChat(); render();
document.getElementById('closeSheet').addEventListener('click',closeSheet);
window.addEventListener('popstate',closeSheet);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && location.pathname.toLowerCase().endsWith('.pdf')) location.replace('./');
});
